name: Task
description: A small (30–60 min) unit of work with clear acceptance criteria
labels: ["task"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this task exists; links to the project plan section / ADR.
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      description: Checklist of observable outcomes.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Test plan
      description: How it is verified (unit test, golden image, contact sheet review, …).
    validations:
      required: true
  - type: textarea
    id: learn
    attributes:
      label: Learning note
      description: Concept(s) involved, for docs/learning-log.md (optional).
