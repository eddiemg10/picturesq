name: Bug
description: Something produces wrong output or crashes
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened vs expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro (command, config, camera/RAW type)
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment (`picturesq doctor --json`)
