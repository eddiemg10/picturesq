# Publishes to PyPI on version tags (trusted publishing; no API token).
# The `pypi` environment only accepts `v*` tags. Bump `version` in pyproject.toml to match the tag.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv publish --trusted-publishing always
