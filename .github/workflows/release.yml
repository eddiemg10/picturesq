# Publishes to PyPI on version tags (trusted publishing; no API token).
# The `pypi` environment only accepts `v*` tags. Bump `version` in pyproject.toml to match the tag.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false # never restore a cache into the publishing job
      - run: uv build
      - run: uv publish --trusted-publishing always
