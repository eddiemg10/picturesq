version: 1
name: bleach_bypass
category: cinematic
description: Harsh, silvery and desaturated, crushed shadows, like skipping the bleach in film processing
parameters:
  saturation: {default: -0.5, min: -0.9, max: 0.0, label: Saturation}
operations:
  - {op: saturation, amount: $saturation}
  - {op: contrast, amount: 0.3}
  - {op: tone_curve, points: [[-4.0, -4.4], [0.0, 0.0], [3.0, 3.2]]}
  - {op: vignette, amount: -0.3, midpoint: 0.4}
