version: 1
name: street
category: bw
description: Gritty, high-contrast black and white with grain and dark corners
parameters:
  grain: {default: 0.025, min: 0.0, max: 0.06, label: Grain}
  vignette: {default: -0.45, min: -1.5, max: 0.0, label: Vignette}
operations:
  - {op: channel_mixer, red: 0.45, green: 0.45, blue: 0.10, amount: 1.0}
  - {op: contrast, amount: 0.32}
  - {op: vignette, amount: $vignette, midpoint: 0.35, roundness: 0.6}
  - {op: grain, amount: $grain}
